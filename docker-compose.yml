name: the-becoming

services:

  db:
    restart: unless-stopped
    image: 'postgres:17-alpine'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: the_becoming
    volumes:
      - 'db-data:/var/lib/postgresql/data'

  mail:
    restart: unless-stopped
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025'
      - '8025:8025'
    volumes:
      - 'mail-data:/mail'


volumes:
  db-data:
  mail-data:
